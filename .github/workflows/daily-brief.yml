name: 财经早报

on:
  schedule:
    # GitHub Actions 使用 UTC 时间；00:30 UTC = 北京时间 08:30。
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成早报
        env:
          TZ: Asia/Shanghai
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GITHUB_PAGES_URL: ${{ vars.GITHUB_PAGES_URL }}
        run: python main.py

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true

      - name: 推送到微信
        env:
          TZ: Asia/Shanghai
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          GITHUB_PAGES_URL: ${{ vars.GITHUB_PAGES_URL }}
        run: python send_wechat.py
