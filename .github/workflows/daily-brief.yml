name: 财经早报

on:
  schedule:
    # GitHub Actions 使用 UTC 时间；00:30 UTC = 北京时间 08:30。
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei
          fc-cache -fv

      - name: 生成早报
        env:
          TZ: Asia/Shanghai
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GITHUB_PAGES_URL: ${{ vars.PAGES_URL }}
        run: python main.py

      - name: 检查早报文件
        run: |
          test -f summary.json
          test -f docs/index.html
          ls -la
          ls -la docs
          cat summary.json

      - name: 生成PDF早报
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path("docs/index.html")
          html = html_path.read_text(encoding="utf-8")
          font_fix = """
          <style id="codex-cjk-pdf-font-fix">
          * {
            font-family: "Noto Sans CJK SC", "WenQuanYi Zen Hei", "Microsoft YaHei", Arial, sans-serif !important;
          }
          @page {
            size: A4;
            margin: 10mm;
          }
          body {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
          }
          </style>
          """
          if "</head>" in html:
              html = html.replace("</head>", font_fix + "\n</head>", 1)
          else:
              html = font_fix + html
          html_path.write_text(html, encoding="utf-8")
          PY
          google-chrome --headless --disable-gpu --no-sandbox --run-all-compositor-stages-before-draw --print-to-pdf=docs/brief.pdf "file://$PWD/docs/index.html"
          test -f docs/brief.pdf
          ls -lh docs/brief.pdf

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true

      - name: 推送到微信
        env:
          TZ: Asia/Shanghai
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          GITHUB_PAGES_URL: ${{ vars.PAGES_URL }}
        run: python send_wechat.py
